# Circuito 1: óvalo ("O"). Dos rectas y dos curvas.
#
# Unidades: metros y grados. Origen [0, 0] en la esquina inferior izquierda
# del mapa, +x hacia la derecha y +y hacia arriba. El formato se describe en
# circuitos/README.md.

id: ovalo
nombre: Óvalo
descripcion: >-
  Circuito de iniciación: dos rectas de 1 m unidas por dos semicírculos de
  0,5 m de radio. Sirve para comprobar que el robot sigue la línea de forma
  estable.

dimensiones: [2.4, 1.6]
ancho_linea: 0.025

# Los bordes del mapa son paredes: los robots rebotan o se arrastran por ellas.
paredes:
  rozamiento: 0.5
  restitucion: 0.3

trazados:
  - id: ovalo
    cerrado: true
    tramos:
      - {tipo: recta, desde: [0.7, 0.3], hasta: [1.7, 0.3]}
      - {tipo: arco, centro: [1.7, 0.8], radio: 0.5, inicio: -90, fin: 90}
      - {tipo: recta, desde: [1.7, 1.3], hasta: [0.7, 1.3]}
      - {tipo: arco, centro: [0.7, 0.8], radio: 0.5, inicio: 90, fin: 270}
