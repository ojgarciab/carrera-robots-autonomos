# Configuración de NATS para el despliegue local de referencia.
#
# - Sin JetStream: no hay persistencia de mensajes.
# - La pasarela tiene un usuario propio con contraseña.
# - El resto de conexiones (los motores de simulación, con el UUID y el testigo
#   de su mundo) se autentican mediante auth callout: NATS pregunta a la
#   pasarela, que comprueba el testigo en la base de datos y responde con
#   permisos limitados a "mundo.<uuid>.>".
#
# Las variables $NATS_... se toman del entorno del contenedor (ver compose.yaml).

port: 4222
http_port: 8222

authorization {
  timeout: 2s
  users: [
    { user: pasarela, password: $NATS_PASARELA_PASSWORD }
  ]
  auth_callout {
    # Clave pública (nkey de cuenta) con la que deben ir firmadas las
    # respuestas de autenticación. La privada solo la tiene la pasarela.
    issuer: $NATS_CALLOUT_ISSUER
    # Usuarios que no pasan por el auth callout y pueden responder a las
    # consultas de autenticación.
    auth_users: [ pasarela ]
  }
}
