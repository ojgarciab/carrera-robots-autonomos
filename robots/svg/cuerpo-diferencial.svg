<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cuerpo de robot de tracción diferencial: chasis, dos ruedas motrices y rueda
  de bola trasera. Sin sensores, para poder combinarlo con distintas capas.

  Convenio de coordenadas (ver robots/README.md):
    - 1 unidad = 1 mm.
    - (0, 0) = centro de gravedad del robot.
    - +x = frente del robot (hacia la derecha en el dibujo).
    - +y del SVG = derecha del robot (y del robot = -y del SVG).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-90 -90 180 180" width="180" height="180">
  <title>Cuerpo diferencial</title>
  <!-- Chasis -->
  <rect x="-65" y="-45" width="125" height="90" rx="10" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
  <!-- Rueda izquierda (y del robot = +0,055 m) -->
  <rect x="0" y="-63" width="40" height="16" rx="3" fill="#212121"/>
  <!-- Rueda derecha (y del robot = -0,055 m) -->
  <rect x="0" y="47" width="40" height="16" rx="3" fill="#212121"/>
  <!-- Ejes de los motores -->
  <rect x="17" y="-47" width="6" height="94" fill="#9e9e9e"/>
  <!-- Rueda de bola trasera -->
  <circle cx="-50" cy="0" r="8" fill="#bdbdbd" stroke="#616161" stroke-width="2"/>
  <!-- Centro de gravedad -->
  <circle cx="0" cy="0" r="3" fill="#ffffff"/>
</svg>
