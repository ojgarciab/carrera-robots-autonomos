<?xml version="1.0" encoding="UTF-8"?>
<!--
  Placa frontal con 3 sensores infrarrojos separados 15 mm.
  Mismo convenio de coordenadas que cuerpo-diferencial.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-90 -90 180 180" width="180" height="180">
  <title>Sensores 3 IR</title>
  <!-- Soporte y placa -->
  <rect x="50" y="-6" width="14" height="12" fill="#424242"/>
  <rect x="62" y="-24" width="14" height="48" rx="2" fill="#1a237e"/>
  <!-- Sensores: izquierdo (y del robot +0,015), central y derecho (-0,015) -->
  <circle cx="70" cy="-15" r="4" fill="#e53935"/>
  <circle cx="70" cy="0" r="4" fill="#e53935"/>
  <circle cx="70" cy="15" r="4" fill="#e53935"/>
</svg>
